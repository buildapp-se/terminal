<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>./terminal | Lär dig terminalen</title>
<meta name="description" content="Uppgifter faller som tetrisblock. Skriv rätt terminalkommando innan de når botten: filer, git, GitHub och verktygen Claude Code använder.">
<link rel="canonical" href="https://buildapp.se/terminal/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Färger från VS Code Dark Modern och dess terminal */
:root{color-scheme:dark;--bg:#181818;--editor:#1F1F1F;--border:#2B2B2B;--fg:#CCCCCC;--dim:#9D9D9D;--faint:#6E7681;--accent:#0078D4;
  --green:#23D18B;--blue:#3B8EEA;--red:#F14C4C;--yellow:#E5C07B;--comment:#6A9955;
  --key:#9CDCFE;--str:#CE9178;--num:#B5CEA8;--brace:#FFD700;
  --ui:"Segoe WPC","Segoe UI",system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',Consolas,Menlo,monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--ui);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.win{display:flex;flex-direction:column;height:100dvh}

.titlebar{height:35px;flex:none;display:flex;align-items:center;gap:6px;padding-left:8px;background:var(--bg);border-bottom:1px solid var(--border);color:var(--dim)}
.titlebar img{width:16px;height:16px;margin-right:4px}
.menu button{padding:3px 7px;border-radius:4px}.menu button:hover,.menu button[aria-expanded=true]{background:#2A2D2E;color:var(--fg)}
.pop{position:fixed;z-index:50;min-width:250px;padding:4px;background:#1F1F1F;border:1px solid #454545;border-radius:6px;box-shadow:0 2px 8px #000a;font-size:13px}
.pop button{display:flex;width:100%;gap:2em;justify-content:space-between;padding:3px 10px;border-radius:4px;color:var(--fg);text-align:left}.pop button:hover,.pop button:focus{background:var(--accent);color:#fff;outline:0}.pop kbd{color:var(--dim);font:inherit}.pop button:hover kbd,.pop button:focus kbd{color:#fff}.pop hr{border:0;border-top:1px solid #454545;margin:4px 0}
.q{width:min(100%,60ch);font:inherit;color:var(--fg);background:#313131;border:1px solid var(--accent);border-radius:4px;padding:3px 8px;margin:.6em 0}
html.alarm::after{content:'';position:fixed;inset:0;z-index:99;pointer-events:none;background:#f00;opacity:0;animation:alarm .4s steps(1) 5}@keyframes alarm{50%{opacity:.28}}@media (prefers-reduced-motion:reduce){html.alarm::after{animation:none;opacity:.15}}
.crash{position:fixed;inset:0;z-index:100;padding:24px;overflow:auto;font:15px/1.5 var(--mono);white-space:pre-wrap;background:#000;color:#ccc}.crash.bsod{background:#0078D7;color:#fff;font-family:var(--ui);font-size:20px;padding:10vh 10vw}.crash.bsod big{font-size:120px;line-height:1;display:block;margin-bottom:.3em}.crash input{font:inherit;color:inherit;background:none;border:0;outline:0;width:60ch;max-width:100%}
.zen .titlebar,.zen .activity,.zen .side,.zen .editor,.zen .sash,.zen .status{display:none}
.cmdcenter{flex:0 1 380px;margin:0 auto;height:24px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #3C3C3C;border-radius:6px;background:#222;color:var(--dim)}
.winctl{display:flex;height:100%}
.winctl button{width:46px;display:grid;place-items:center;height:100%}.winctl button:hover{background:#2A2D2E}.winctl button:last-child:hover{background:#C42B1C;color:#fff}.cmdcenter:hover{border-color:#555}

.main{flex:1;display:flex;min-height:0}
.activity{width:48px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding-top:4px;color:#868686}
.activity>button{width:48px;height:48px;display:grid;place-items:center}.activity>button:hover{color:#D7D7D7}
.activity>button.on{color:#D7D7D7;box-shadow:inset 2px 0 var(--accent)}
.activity .acct{margin-top:auto;width:48px;height:48px;display:grid;place-items:center;color:inherit}.activity .acct:hover{color:#D7D7D7}
.activity .gear{width:48px;height:48px;display:grid;place-items:center;color:inherit}.activity .gear:hover{color:#D7D7D7}
.work{flex:1;display:flex;flex-direction:column;min-width:0}

.editor{flex:none;display:flex;flex-direction:column;overflow:hidden;background:var(--editor)}
.side{width:250px;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--bg);border-right:1px solid var(--border)}
.side[hidden]{display:none}
.side-h{height:35px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 20px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.side-h .x{display:none;font-size:18px;padding:0 4px}
.side-b{flex:1;overflow:auto;min-height:0}
.sec{display:flex;align-items:center;height:22px;width:100%;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:left}
.row{display:flex;align-items:center;gap:5px;height:22px;width:100%;padding-right:8px;white-space:nowrap;text-align:left;color:var(--fg)}
.row:hover,.sec:hover{background:#2A2D2E}.row.sel{background:#37373D}.row:focus-visible,.sec:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
.tw{width:16px;flex:none;color:var(--fg);display:grid;place-items:center}.open>.tw svg{transform:rotate(90deg)}
.ic{width:16px;flex:none;font:700 9px/1 var(--mono);text-align:center}
.row .d{color:var(--faint);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.st{margin-left:auto;font-weight:700;font-size:12px}.gdot{color:var(--accent);font-size:10px;margin-right:6px}.st-U{color:#73C991}.st-M{color:#E2C08D}.st-D{color:#C74E39}
.side .q{display:block;width:calc(100% - 24px);margin:4px 12px 8px}
.side textarea.q{resize:none;font:inherit}
.hit{display:block;width:100%;text-align:left;padding:3px 12px 3px 22px}.hit:hover{background:#2A2D2E}
.hit code{display:block;font:12px/1.5 var(--mono);color:var(--yellow);white-space:pre-wrap}.hit small{display:block;color:var(--faint);font-size:12px}
#hits pre{padding:4px 22px;font:12px/1.5 var(--mono);white-space:pre-wrap}
.note{padding:8px 20px;color:var(--faint);font-size:12px}
.btn{display:block;width:calc(100% - 24px);margin:6px 12px;padding:4px;border-radius:2px;background:var(--accent);color:#fff;text-align:center}.btn:hover{background:#026EC1}
.ext{display:flex;gap:10px;padding:8px 12px}.ext:hover{background:#2A2D2E}
.ext i{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:4px;font:700 13px var(--mono);color:#fff;font-style:normal}
.ext b{display:block;font-weight:600}.ext small{display:block;color:var(--dim);font-size:12px}
.sash{flex:none;height:4px;margin:-2px 0;position:relative;z-index:3;cursor:ns-resize;touch-action:none}
.sash:hover,.sash.drag,.sash:focus-visible{background:var(--accent);outline:0;transition:background .1s .2s}
.mdh{color:#569CD6;font-weight:700}
.tab.preview{font-style:italic}.tab.dirty::after{content:'\25CF';margin-left:4px;color:#fff}
.code .edit{grid-column:1/-1;width:100%;height:100%;min-height:200px;resize:none;border:0;outline:0;padding:0 12px 0 72px;background:var(--editor);color:#D4D4D4;font:inherit;white-space:pre;tab-size:2}
.tabs{flex:none;display:flex;height:35px;background:var(--bg);border-bottom:1px solid var(--border)}
.tab{display:flex;align-items:center;gap:6px;padding:0 12px;border-right:1px solid var(--border);color:var(--dim)}
.tab:hover{color:#fff}.tab.on{background:var(--editor);color:#fff;box-shadow:inset 0 1px var(--accent);margin-bottom:-1px}
.tab b{color:var(--brace);font-weight:400;font-family:var(--mono)}
.crumbs{flex:none;padding:2px 16px;color:var(--dim);font-size:12px}
.code{flex:1;min-height:0;overflow:auto;align-content:start;display:grid;grid-template-columns:50px 1fr;font:13px/19px var(--mono);padding:2px 0 8px;white-space:pre}
.code .ln{color:var(--faint);text-align:right;padding-right:22px}
.k{color:var(--key)}.s{color:var(--str)}.n{color:var(--num)}.br{color:var(--brace)}

.panel{flex:1;display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--border);background:var(--bg)}
.ptabs{height:35px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;font-size:11px;letter-spacing:.04em}
.ptabs{overflow:hidden}
.ptabs>button{padding:0 6px;line-height:33px;color:var(--dim);white-space:nowrap}.ptabs>button:hover{color:#E7E7E7}
.ptabs>button.on{color:#E7E7E7;box-shadow:inset 0 -1px #E7E7E7}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#616161;color:#fff;text-align:center;line-height:18px;letter-spacing:0}
.badge[data-n="0"]{display:none}
.pright{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--dim);letter-spacing:0;font-size:12px}

.term{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 20px 6px;font:14px/1.4 var(--mono);cursor:text}
.well{position:relative;flex:1;min-height:120px;overflow:hidden}
.log{flex:none;height:9.8em;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.prompt{flex:none;display:flex;flex-wrap:wrap;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.u{color:var(--green);font-weight:700}.p{color:var(--blue);font-weight:700}
.agent{color:#D97757;font-weight:700}
.sl{position:absolute;left:0;bottom:30%;z-index:5;margin:0;font:13px/1.15 var(--mono);color:var(--fg);white-space:pre;pointer-events:none;animation:sl 3.2s linear forwards}
@keyframes sl{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
html.crt{filter:sepia(1) hue-rotate(65deg) saturate(4) brightness(.95)}
html.crt::after{content:'';position:fixed;inset:0;z-index:99;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.28) 2px 3px)}
html.crt body{text-shadow:0 0 3px currentColor}.err{color:var(--red)}.cmt{color:var(--comment)}.hot{color:var(--yellow)}.dim{color:var(--faint)}
.line.bad{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cmdbox{position:relative;flex:1 1 12ch;min-width:0}
#cmd{position:absolute;inset:0;width:100%;font:inherit;background:transparent;border:0;outline:0;color:transparent;caret-color:transparent}
#cmd::selection{background:#264F78;color:transparent}
#mirror{white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden}
.cur{background:var(--fg);color:var(--bg)}
.blur .cur{background:none;outline:1px solid var(--fg)}
.play .cur,.menu-on .cur{animation:blink 1.06s step-end infinite}
@keyframes blink{50%{background:none;color:inherit}}

/* Blocken: TUI-ramar i paketets färg */
.blk{position:absolute;top:0;padding:.55em .9em .5em;border:1px solid var(--c);background:var(--bg);will-change:transform;transition:opacity .3s,border-color .3s}
.blk .tag{position:absolute;top:-.75em;left:.7em;padding:0 .35em;background:var(--bg);color:var(--c);font-size:12px}
.blk p{color:#E7E7E7}
.blk .prog{color:var(--c);font-size:12px;margin-top:.2em}
.blk .ans{display:none;color:var(--dim);font-size:13px;margin-top:.25em}
.blk.landed{border-color:#4A4A4A;--c:#6E6E6E}
.blk.landed p{color:var(--dim)}
.blk.landed .ans{display:block}
.blk.done{opacity:0;border-color:var(--green);box-shadow:0 0 18px var(--green)}
.blk.miss{animation:shake .25s}
.blk{cursor:help}.blk:hover{box-shadow:0 0 0 1px var(--c)}
.blk .hlp{position:absolute;top:-.75em;right:.7em;padding:0 .35em;background:var(--bg);color:var(--c);font-size:12px}
.parts{display:grid;grid-template-columns:max-content 1fr;gap:.2em 2ch;margin:.6em 0;text-align:left}
.parts dt{color:var(--yellow);white-space:nowrap}.parts dd{margin:0}

.screen{position:absolute;inset:0;overflow:auto;padding:12px 0 8px;z-index:5;background:var(--bg)}
.screen[hidden]{display:none}
.logo{font:clamp(5px,1.5vw,12px)/1.1 var(--mono);color:var(--blue);white-space:pre;margin:4px 0 10px}
.logo.over{color:var(--red)}
.screen h2{font:inherit;color:var(--comment);margin-top:1.1em}
.cols{display:grid;gap:0 6ch}
@media (min-width:1000px){.cols{grid-template-columns:auto minmax(0,64ch)}}
.screen p{max-width:76ch}
.opts{display:flex;flex-direction:column;align-items:flex-start}
.opt{padding:1px 6px;margin-left:-6px;text-align:left;white-space:pre}
.opt[aria-pressed=true]{background:#264F78;color:#fff}
.opt:hover{background:#2A2D2E}
.opt[aria-pressed=true]:hover{background:#264F78}
.opt .dim{margin-left:1ch}
.dbg{display:flex;gap:1ch}.dbg input{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit}
@media (max-width:700px){.opt{white-space:normal}.opt .dim{display:block;margin-left:0}} /* smal skärm: undertexten på egen rad */
.qz .opt{white-space:pre-wrap;margin-bottom:2px}.opt.ok{background:#1E3A2A;color:#89D185}.opt.no{background:#4B1818;color:#F48771}.opt:disabled{cursor:default}
.pairs{display:grid;gap:.6em 4ch}@media (min-width:900px){.pairs{grid-template-columns:auto 1fr}}
.lvl{display:flex;align-items:center;gap:1ch}
.lvl button{padding:0 6px;color:var(--blue)}
.scores{border-collapse:collapse}
.scores td{padding:0 2ch 0 0;white-space:nowrap}
.scores td:nth-child(2){text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:1ch 3ch;margin-top:1.1em}
.actions button{color:var(--blue)}
.actions button:hover,.lvl button:hover{text-decoration:underline}
kbd{font:inherit;color:var(--yellow)}

.status{height:22px;flex:none;display:flex;align-items:center;border-top:1px solid var(--border);color:var(--fg);font-size:12px}
.status>span,.status>button{display:flex;align-items:center;gap:4px;height:100%;padding:0 8px;white-space:nowrap}
.status .remote{background:var(--accent);color:#fff;padding:0 10px}
.status .sp{margin-left:auto}
.status>button:hover{background:#2A2D2E}

.term{position:relative}
.pet{position:absolute;right:12px;bottom:26px;width:56px;height:56px;padding:0;z-index:4;cursor:pointer}
.pet svg{display:block;width:100%;height:100%;transform:scale(var(--s,1));transform-origin:50% 100%;overflow:visible}
.pet:hover svg{transform:scale(var(--s,1)) rotate(-4deg)}
.pet:focus-visible{outline:1px solid var(--accent)}
.pet .bin{position:absolute;right:58px;bottom:4px;font:11px var(--mono);color:#7A7A7A;white-space:nowrap;pointer-events:none}.pet .bin b{color:#8FE3C8;font-weight:400}
.pet .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
.pet .egg{transform-box:fill-box;transform-origin:50% 100%;animation:wobble 3s ease-in-out infinite}
.pet.eat .body,.pet.happy .body{animation:boing .32s ease-in-out 3}.pet.scared .body{animation:shiver .12s linear infinite}.pet.sad .body{animation:none;transform:scaleY(.94)}
.pet.sleep .body{animation-duration:4.5s}.pet .zz{animation:zz 3s ease-in-out infinite}
.pet .chomp{transform-box:fill-box;transform-origin:center;animation:chomp .18s ease-in-out infinite alternate}
.pet .wave{transform-box:fill-box;transform-origin:50% 100%;animation:wave .3s ease-in-out infinite alternate}
.pet .blink{animation:blink 1s steps(1) infinite}.pet .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}.pet .eye{transform-box:fill-box;transform-origin:center;animation:eyes 5s infinite;translate:var(--lx,0) var(--ly,0);transition:translate .3s}
.pet .fly{position:absolute;left:50%;top:40%;font:700 11px var(--mono);color:#8FE3C8;pointer-events:none;animation:munch .7s ease-in both}
.pet .fly.heart{color:#FF4F8B;font-size:14px;animation:float 1.1s ease-out both}
@keyframes breathe{50%{transform:scale(1.03,.97)}}@keyframes wobble{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-7deg)}86%{transform:rotate(6deg)}93%{transform:rotate(-3deg)}}
@keyframes boing{50%{transform:translateY(-14%) scale(.95,1.06)}}@keyframes shiver{50%{transform:translateX(3%)}}
@keyframes chomp{to{transform:scaleY(.25)}}@keyframes wave{to{rotate:25deg}}@keyframes blink{50%{opacity:0}}@keyframes twinkle{50%{transform:scale(.7) rotate(20deg);opacity:.7}}
@keyframes eyes{0%,94%,100%{transform:none}97%{transform:scaleY(.1)}}@keyframes zz{50%{translate:2px -3px;opacity:.5}}
@keyframes munch{from{translate:var(--x) -18px;opacity:0}30%{opacity:1}to{translate:-4px 4px;opacity:0;scale:.4}}
@keyframes float{from{translate:0 0;opacity:0}20%{opacity:1}to{translate:var(--x) -46px;opacity:0;scale:1.4}}
@media (max-width:700px){.pet{width:46px;height:46px}.pet .bin{right:48px}}
.bubble{position:absolute;right:10px;bottom:86px;z-index:5;max-width:min(320px,calc(100% - 20px));padding:6px 10px;border:1px solid #454545;border-radius:6px;background:#252526;color:var(--fg);font:12px/1.45 var(--ui);box-shadow:0 2px 8px #0008}
.bubble::after{content:'';position:absolute;right:22px;bottom:-6px;width:10px;height:10px;background:#252526;border:solid #454545;border-width:0 1px 1px 0;transform:rotate(45deg)}
.chat{width:270px;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--bg);border-left:1px solid var(--border)}
.chat[hidden]{display:none}
.chat-pet{flex:none;display:grid;place-items:center;padding:14px 0 4px}
.pet.big{position:relative;right:auto;bottom:auto;width:132px;height:132px}.pet.big .bin{display:none}.pet.big .fly{font-size:16px}
.reg{flex:none;padding:0 16px 12px;text-align:center;font-size:12px;border-bottom:1px solid var(--border)}
.reg .nm{font-weight:600;color:var(--fg);margin-bottom:8px}
.lamps{display:flex;justify-content:center;gap:2px;flex-wrap:wrap}.lamps .gap{width:6px}
.lamp{display:flex;flex-direction:column;align-items:center;width:26px}.lamps.many{gap:1px}.lamps.many .lamp{width:16px}
.lamp b{display:grid;place-items:center;width:calc(100% - 2px);height:28px;border-radius:4px;background:#262626;color:#7A7A7A;font:400 15px var(--mono)}.lamps.many .lamp b{height:22px;font-size:12px}
.lamp.on b{background:#1E4D3E;color:#8FE3C8;box-shadow:0 0 8px #8FE3C866}
.lamp small{font:9px var(--mono);color:var(--faint);margin-top:2px}
.reg .sum{margin-top:8px;font:12px var(--mono);color:var(--dim)}
.reg .meter{height:4px;margin:10px 0 4px;border-radius:2px;background:#262626;overflow:hidden}.reg .meter i{display:block;height:100%;background:linear-gradient(90deg,#8FE3C8,#B8C4FF)}
.reg .left{font-size:11px;color:var(--faint)}
.chat-log{flex:1;overflow:auto;min-height:0;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.chat-log .empty{color:var(--faint);font-size:12px;line-height:1.5}
.msg{padding:7px 10px;border-radius:6px;background:#202020;border-left:3px solid var(--k);font-size:12.5px;line-height:1.5;color:var(--fg)}
.msg .lbl{display:block;font:600 10px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--k);margin-bottom:2px}
.msg.new{animation:pop .35s ease-out}@keyframes pop{from{translate:0 6px;opacity:0}}
.k-tips{--k:#4FC1FF}.k-varning{--k:#F14C4C}.k-fakta{--k:#D3B8FF}.k-nytt{--k:#8FE3C8}
.bitbtn{display:grid;place-items:center;width:30px;height:26px;border-radius:4px;color:var(--dim)}.bitbtn:hover{background:#2A2D2E}.bitbtn[aria-pressed="true"]{color:var(--fg)}
@media (max-width:999px){.bitbtn{display:none}}
@media (max-height:760px),(max-width:700px){.editor,.sash{display:none}}
@media (max-width:700px){.side{position:fixed;inset:35px 0 22px;width:auto;z-index:20}.side-h .x{display:block}.activity,.menu,.winctl,.status .hide,.ptabs>button:not(.on):not(:first-child),.pright{display:none}.term{padding:0 10px 6px;font-size:13px}.cmdcenter{flex-basis:auto;padding:0 12px}}
@media (prefers-reduced-motion:reduce){.pet,.pet *{animation:none!important}.sl{animation:none;left:16px}.blk{transition:none}.line.bad,.blk.miss{animation:none}}
</style>
</head>
<body>
<div class="win">

// Ett tal som summan av platsvärdena där binärtalet har en etta: 13 = 1101 = 8 + 4 + 1
// Binärt i hela nibbles med inledande nollor, som lampor i ett register: 5 = 0101, 18 = 0001 0010 (Patrik 2026-10-17)
const binStr = n => { const b = n.toString(2); return b.padStart(Math.ceil(b.length / 4) * 4, '0').replace(/(.{4})(?=.)/g, '$1 '); };
const binParts = n => n.toString(2).split('').map((d, i, a) => (d === '1' ? 2 ** (a.length - 1 - i) : 0)).filter(Boolean).map(v => v.toLocaleString('sv-SE')).join(' + ') || '0';

// Fyller i {d}, {f2} osv. {x2} blir alltid något annat än {x}.
function fill(task, pick, ps = false) {
  const [pack, , text, bashAns, bashWhy, psAns, psWhy] = task, lv = lvOf(task, ps), v = {};
  const ans = ps && psAns !== '=' ? psAns : bashAns, why = ps && psWhy || bashWhy;
  const sub = s => s.replace(/\{(\w+?)(2?)\}/g, (m, k, two) => {
    if (!POOLS[k]) return m;
    const key = k + two, other = two ? k : k + '2';
    if (!(key in v)) v[key] = pick(POOLS[k].filter(x => x !== v[other]), key);
    return v[key];
  });
  const alts = a => (Array.isArray(a) ? a : [a]);
  const steps = Array.isArray(ans) && Array.isArray(ans[0]) ? ans.map(alts) : [alts(ans)];
  // other: svaret i det andra skalet, som hjälpkortet visar under ditt
  const first = (a, sep) => (Array.isArray(a) && Array.isArray(a[0]) ? a.map(x => alts(x)[0]).join(sep) : alts(a)[0]);
  const other = !psAns || psAns === '=' ? null : ps ? sub(first(bashAns, ' && ')) : sub(first(psAns, '; '));
  return {task, pack, lv, text: sub(text), why: sub(why), other,
    steps: steps.map(s => s.map(x => { const raw = sub(x); return {raw, key: canon(tokenize(raw, ps), ps)}; }))};
}

function mp3Music(a) {
  const tracks = {}, {mute, setVolume} = a;
  let cur = null, vol = .8, muted = false;
  const apply = () => Object.values(tracks).forEach(t => (t.volume = muted ? 0 : vol * .6));

    play(style) {
      const t = tracks[style] ??= Object.assign(new Audio(`_musik/${style}.mp3`), {loop: true});
      apply();
      if (t === cur) return;
      cur?.pause(); cur = t; t.currentTime = 0;
      t.play().catch(() => {});
    },
    stop() { cur?.pause(); cur = null; },
    // preservesPitch är på som standard: tempot höjs utan att tonen gör det. Över 1,25 låter det sönderstretchat.

    mute(m) { mute(m); muted = m; apply(); },
  });
}

// Lättare och vanligare uppgifter oftare, svåra då och då. Uppgifter i Filer & mappar får mallorden ur
// filsystemet och provkörs på en kopia, så att blocket bara ber om det som går att göra där du står.
function draw(pool, dup = false) {
  const weighted = pool.flatMap(t => Array(6 - lvOf(t, S.ps)).fill(t));
  const near = [S.cwd, []].flatMap(at => Object.entries(look(S.fs, at, S.ps).node || {})).filter(([n]) => !n.startsWith('.')); // dolt hittar man själv
  const names = (list, k) => {
    if (k.endsWith('2')) return list.filter(n => look(S.fs, [...S.cwd, n], S.ps).node === undefined);
    const ext = {log: /\.log$/, py: /\.py$/, js: /\.js$/}[k];
    return [...new Set([...list, ...near.filter(([n, v]) => (k === 'd' ? typeof v === 'object' : typeof v === 'string' && (!ext || ext.test(n)))).map(([n]) => n)])];
  };
  for (let i = 0; i < 40; i++) {
    const t = rnd(weighted), b = fill(t, t[0] === 'fs' ? (list, k) => rnd(names(list, k)) : rnd, S.ps);
    if ((dup || !S.blocks.some(x => x.text === b.text)) && (t[0] !== 'fs' || doable(b))) return b;
  }
  return null;
}
// Varför blockets svar inte går att köra i världen som den är nu: skalets felmeddelande, 'same' om inget skulle ändras, null om det går
function blocker(b) {
  const fs = structuredClone(S.fs);
  let cwd = S.cwd;
  try {
    for (const st of b.steps) {
      const r = fake(fs, cwd, st[0].key, S.ps);
      if (r?.same) return 'same';
      if (r) cwd = r.cwd;
    }
    return null;
  } catch (e) { return e.message; }
}
const doable = b => !blocker(b);

function spawn() {
  const floors = [...Array(S.lanes)].map((_, lane) => {
    const inLane = S.blocks.filter(b => b.lane === lane);
    const top = Math.min(Infinity, ...inLane.filter(b => !b.landed).map(b => b.y));
    const floor = Math.min(S.H, ...inLane.filter(b => b.landed).map(b => b.y));
    return {lane, top, floor};
  }).filter(l => l.top > 10);
  if (!floors.length) return false;
  const best = Math.max(...floors.map(l => l.floor));
  const lane = rnd(floors.filter(l => l.floor === best)).lane;

  // Filer & mappar: ett block i taget, i ordning. Ny mapp: lista först, kör programmen som finns där, gå sedan in i en mapp.
  const story = S.pack === 'fs', here = S.cwd.join('/');
  if (story && S.blocks.some(b => !b.landed)) return false;
  if (S.blocks.filter(b => !b.landed).length > S.level) return false; // högst nivå + 1 i luften: lugn början utan lugnt läge (Patrik 2026-10-17)
  const maxLv = maxLvFor(S.pack, S.ps, S.level);
  const fits = t => (S.pack === 'all' || t[0] === S.pack) && lvOf(t, S.ps) <= maxLv && (!S.ps || t[5]);
  const lists = t => t[2] === 'Lista filerna i mappen du står i', runs = t => t[0] === 'fs' && /^(python|node) /.test(t[5] === '=' ? t[3] : t[5]);
  const enters = t => t[2] === 'Gå in i mappen {d}';
  let pool = TASKS.filter(t => fits(t) && !S.recent.includes(t) && !(lists(t) && S.seen.has(here)));
  if (!pool.length) pool = TASKS.filter(fits);
  const phases = story ? [!S.seen.has(here) && S.seen.size < 3 && TASKS.filter(lists), !S.ran.has(here) && TASKS.filter(t => runs(t) && fits(t)), !S.went.has(here) && TASKS.filter(enters), pool, TASKS.filter(fits)] : [pool, TASKS.filter(fits)]; // sist: även nyss använda, om inget annat går att göra här
  let b = null;
  for (const ph of phases) if (ph && (b = draw(ph))) break;
  // Små paket: när alla uppgifter redan ligger i brunnen kommer en dubblett, annars fryser rundan
  if (!b && !story) b = draw(TASKS.filter(fits), true);
  if (!b) return false;
  if (story && runs(b.task)) S.ran.add(here);
  if (story && enters(b.task)) S.went.add(here);
  S.recent.push(b.task);
  if (S.recent.length > Math.min(8, pool.length - 1)) S.recent.shift();

  const el = document.createElement('div');
  el.className = 'blk';
  el.style.setProperty('--c', PACKS[b.pack].c);
  el.style.left = `calc(${lane * 100 / S.lanes}% + 4px)`;
  el.style.width = `calc(${100 / S.lanes}% - 8px)`;
  el.innerHTML = `<span class="tag">${PACKS[b.pack].tag}</span><button class="hlp" tabindex="-1" aria-label="hjälp för blocket">?</button><p>${esc(b.text)}</p>` +
    (b.steps.length > 1 ? `<p class="prog">steg 1 av ${b.steps.length}</p>` : '') + '<code class="ans"></code>';
  el.addEventListener('click', () => help(b));
  well.append(el);
  Object.assign(b, {el, lane, step: 0, landed: false, h: el.offsetHeight});
  b.y = -b.h;
  S.blocks.push(b);
  return true;
}

function land(b) {
  b.landed = true;
  b.order = ++S.seq;
  b.el.classList.add('landed');
  b.el.querySelector('.ans').textContent = sig() + show(b.steps[b.step][0].raw);
  S.streak = 0;
  out(`# missat: ${show(b.steps[b.step][0].raw)}`, 'hot');
  sfx('land');
}

function tick(dt) {
  S.time += dt;
  const speed = S.H / Math.max(7, 26 - 2 * (S.level - 1)); // sekunder från topp till botten
  if (!S.blocks.some(b => !b.landed)) S.spawnIn = Math.min(S.spawnIn, .5);
  if ((S.spawnIn -= dt) <= 0) S.spawnIn = spawn() ? Math.max(1.8, 7 - .55 * (S.level - 1)) : .3;

  for (let lane = 0; lane < S.lanes; lane++) {
    let floor = S.H;
    const inLane = S.blocks.filter(b => b.lane === lane);
    for (const b of inLane.filter(b => b.landed).sort((a, c) => a.order - c.order)) {
      b.y = Math.min(b.y + 900 * dt, floor - b.h); // faller ner när ett block under rensats
      floor = b.y;
    }
    for (const b of inLane.filter(b => !b.landed).sort((a, c) => c.y - a.y)) {
      b.y += speed * dt;
      if (b.y + b.h >= floor) {
        b.y = floor - b.h;
        land(b);
        if (b.y < 0) return gameOver();
      }
      floor = Math.min(floor, b.y);
    }
  }
  for (const b of S.blocks) b.el.style.transform = `translateY(${b.y}px)`;
  stats();
  petIdle();
}

function remove(b) {
  S.blocks.splice(S.blocks.indexOf(b), 1);
  b.el.classList.add('done');
  setTimeout(() => b.el.remove(), 300);
}

// Poäng per rensat block. Ju högre upp blocket är när du löser det, desto snabbare var du.
// Landade block visar svaret, så de ger halva. combo = antal block rensade med samma Enter.
function points(b, combo, level) {
  if (b.helped) return 0; // hjälpkort eller sökning: blocket räknas, men ger inga poäng
  const base = 10 * level * b.steps.length;
  if (b.landed) return Math.round(base / 2); // ingen kombo på missade block, annars lönar det sig att vänta
  return Math.round(base * (2 - Math.max(0, b.y) / S.H)) * combo;
}

function helpText(u) {
  const [c, sub] = [u[0].toLowerCase(), u[1]];
  if (c !== 'git') return `Usage: ${u[0]} [OPTION]...\n# riktiga ${u[0]} --help listar alla flaggor och vad de gör. Läs uppifrån, det viktigaste står först.`;
  const name = sub === 'help' ? u[2] : sub && !sub.startsWith('-') ? sub : null;
  if (!name) return GITHELP + '\n# git <kommando> --help visar manualen för ett av dem.';
  if (u.includes('-h')) return `usage: git ${name} [<options>]\n# riktiga git ${name} -h listar flaggorna för ${name} direkt i terminalen.`;
  return `# git ${name} --help öppnar hela manualen för git ${name}: i webbläsaren på Windows, i terminalen på Mac och Linux (q stänger).\n# Kort hjälp direkt i terminalen: git ${name} -h`;

  if (S.ps) {
    if (!KNOWNPS.has(c.toLowerCase())) return msgs.push(`${c} : The term '${c}' is not recognized as the name of a cmdlet, function, script file, or operable program.\nCheck the spelling of the name, or if a path was included, verify that the path is correct and try again.`);
    const real = psCmd(c);
    for (const t of u.slice(1)) if (/^-[a-z]/i.test(t) && psparam(real, t.slice(1).toLowerCase().split(':')[0]) === null) {
      bad.add(t);
      return msgs.push(`${PSNAME[real] || c} : A parameter cannot be found that matches parameter name '${t.slice(1)}'.`);
    }
  } else if (!KNOWN.has(c)) return msgs.push(`bash: ${c}: command not found`);
  if (c === 'git' && sub?.startsWith('-')) return msgs.push(`unknown option: ${sub}\n${MISSING.git}`);
  if (c === 'git' && sub && !GIT.has(sub)) return msgs.push(`git: '${sub}' is not a git command. See 'git --help'.`);
  if (!S.ps && u.length === 1 && MISSING[c]) return msgs.push(MISSING[c]);
  let near = null, most = -1;
  for (const b of S.blocks) for (const a of b.steps[b.step] || []) {
    const tk = tokenize(a.raw, S.ps);
    const hits = u.filter(t => tk.includes(t)).length;
    if ((S.ps ? psCmd(tk[0]) === psCmd(c) : tk[0] === c) && hits > most) { near = tk; most = hits; }
  }
  const flagOk = t => /^-[A-Za-z]+$/.test(t) && [...t.slice(1)].every(l => near.some(n => /^-[A-Za-z]+$/.test(n) && n.includes(l)));
  const wrong = near ? u.slice(1).filter(t => !near.includes(t) && !flagOk(t) && !near.includes(ANY)) : u.slice(1);
  const mi = u.findIndex(t => /^-[a-z]*m$/.test(t));
  if (c === 'git' && sub === 'commit' && mi > 0 && u.slice(mi + 2).some(t => !t.startsWith('-'))) msgs.push('# meddelandet har mellanslag: sätt citattecken runt det, git commit -m "fixa menyn"');
  // Allt du skrev stämmer men något saknas: markera inget rött, de rätta orden är inte felet
  else if (near && !wrong.length && u.length < near.length) return msgs.push('# rätt kommando, men en flagga eller ett argument saknas. Klicka på blocket för hjälp.');
  (wrong.length ? wrong : u.length > 1 ? u.slice(1) : u).forEach(t => bad.add(t));
}

function run(raw) {
  if (!raw.trim()) return echo(raw, new Set());
  hist.push(raw); hpos = hist.length;
  if (S.vim) return vimSay(raw);
  if (S.agent && !raw.trimStart().startsWith('!')) return agentSay(raw);
  const line = S.agent ? raw.trimStart().slice(1) : raw; // ! kör skalet, som i Claude Code
  let segs;
  try { const tk = tokenize(line, S.ps), bad = syntax(tk, S.ps); if (bad) throw Object.assign(new Error(bad), {syntax: true}); segs = segments(tk); }
  catch (e) {
    echo(raw, new Set());
    out(e.syntax ? e.message : S.ps ? 'The string is missing the terminator: ' + e.message + '.' : `bash: unexpected EOF while looking for matching \`${e.message}'`, 'err');
    return fail();
  }

  if (WIPE.test(line.trim())) { echo(raw, new Set()); return crash(); }
  const who = segs.length === 1 && segs[0].length === 1 && segs[0][0].toLowerCase();
  if (!S.agent && Object.hasOwn(AGENTS, who)) { echo(raw, new Set()); return enterAgent(who); }
  if (egg(segs.length === 1 ? segs[0] : [], raw)) return;
  const andor = S.ps && segs.find(g => g.op === '&&' || g.op === '||')?.op;
  if (andor) {
    echo(raw, new Set());
    out(`The token '${andor}' is not a valid statement separator in this version.`, 'err');
    out('# PowerShell 5.1 har inte && och ||. Skriv ; mellan kommandona. && kom i PowerShell 7.', 'cmt');
    return fail();
  }
  // man, och Get-Help/help/man i PowerShell, öppnar hjälpkortet som ett klick:
  // utan namn för blocket närmast botten, med namn för blocket vars svar börjar med det kommandot
  const [h, ...hw] = segs.length === 1 ? segs[0] : [], [name, extra] = hw.filter(t => !t.startsWith('-')); // Get-Help ls -Examples: växlarna spelar ingen roll här
  if (h && !extra && (S.ps ? psCmd(h) === 'get-help' : h === 'man')) {
    const uses = a => { const c = tokenize(a.raw, S.ps)[0]; return S.ps ? psCmd(c) === psCmd(name) : c === name; };
    const b = S.blocks.filter(x => x.step < x.steps.length && (!name || x.steps[x.step].some(uses)))
      .sort((x, y) => x.landed - y.landed || y.y - x.y)[0];
    echo(raw, new Set());
    if (b) return help(b);
    if (!name) return out('# inget block att visa hjälp för just nu', 'cmt');
    // Inget block med kommandot: en rad ur hjälpkortets förklaringar, så att man ls inte låtsas att ls saknar manual
    const real = S.ps ? PSNAME[psCmd(name)] || name : name, g = GLOSS[real] ?? GLOSS[name];
    if (g) out(S.ps ? `\nNAME\n    ${real}\n\nSYNOPSIS\n    ${g}\n` : `${name.toUpperCase()}(1)\n\nNAME\n       ${name} - ${g}`);
    if (g) return out(`# den riktiga ${S.ps ? 'hjälpen' : 'manualen'} är längre${S.ps ? ': Get-Help ' + real + ' -Examples visar exempel' : ': mellanslag bläddrar, q stänger'}. Inget block använder ${name} just nu.`, 'cmt');
    return out(S.ps ? `Get-Help : Get-Help could not find ${name} in a help file in this session.` : `No manual entry for ${name}`, 'err');
  }
  const hits = [], bad = new Set(), msgs = [], notes = [], at = S.cwd;
  let errs = 0, progressed = false, typed = 0, prevOk = true, hint = null;
  for (let seg of segs) {
    if ((seg.op === '&&' && !prevOk) || (seg.op === '||' && prevOk)) continue; // bash: && bara efter lyckat, || bara efter fel
    const errsBefore = errs;
    if (!S.ps && seg[0] === 'sudo') seg = seg.slice(1);
    if (!seg.length) continue;
    const c0 = S.ps ? seg[0].toLowerCase() : seg[0];
    if (['clear', 'cls', 'clear-host'].includes(seg[0].toLowerCase()) && seg.length === 1) { clearCmd(); continue; }
    if (c0 === 'exit') { echo(raw, bad); return mode === 'play' ? gameOver() : menu(); }
    if (c0 === 'help') { msgs.push(`# Skriv kommandot som blocket beskriver. ${S.ps ? '; mellan kommandon' : '&& eller flera argument'} rensar flera block.\n# man visar hjälpkortet för blocket närmast botten (0 poäng för det blocket). ↑ hämtar förra kommandot, Esc pausar, exit avslutar, ${S.ps ? 'cls' : 'clear'} tömmer brunnen om du har en laddning.`); continue; }
    for (const u of units(seg, S.ps)) { const e0 = errs; try { // finally: $? säger om kommandot gick bra, för nästa echo $?
      const key = canon(u, S.ps), b = target(key);
      // --help är aldrig fel: program visar sin hjälp i båda skalen. PowerShells cmdlets har ingen --help, där pekar vi på Get-Help.
      const c0l = u[0].toLowerCase(), prog = KNOWN.has(c0l) && (!S.ps || (!Object.hasOwn(PSALIAS, c0l) && !c0l.includes('-')));
      const asks = u.includes('--help') || (c0l === 'git' && (u.includes('-h') || u[1] === 'help'));
      if (!b && prog && asks) { notes.push(helpText(u)); continue; }
      if (!b && S.ps && u.includes('--help')) hint = `# cmdlets har ingen --help. Get-Help ${PSNAME[psCmd(u[0])] || u[0]} visar hjälpen.`;
      // Världen ändras av allt du skriver, block eller inte: filsystemet, mappen du står i och git (clone, init, commit).
      // Filsystemets fel räknas bara där filsystemet rättar: fria kommandon och Filer & mappar.
      let r = null;
      try { r = fake(S.fs, S.cwd, S.ps ? canon(u, true, true) : key, S.ps, S.env); } catch (e) { if (!b || b.pack === 'fs') { errs++; msgs.push(e.message); continue; } }
      if (r) { S.cwd = r.cwd; if (r.seen !== undefined) S.seen.add(r.seen); } // seen kan vara '', hemmappen
      gitWorld(u); // före utskriften, som visar commitens hash
      // Det världen svarade vinner över den påhittade utskriften i OUT; tom utskrift med note (inga träffar) visar noten
      const said = r && (r.out.length ? r.out : r.note ? [r.note] : null);
      if (!b) {
        if (r) { notes.push(...(said ?? (mode === 'play' ? [] : [QUIET]))); continue; }
        if (toy(u, notes) || editorCmd(u, notes)) continue;
        const guess = sample(u, S.ps);
        if (mode !== 'play' && guess.length) { notes.push(...guess); continue; } // i quizet får man prova fritt
        // Ett riktigt kommando som inget block bad om: visa vad det hade gjort, men det kostar ändå (låst beslut, mellanläge Patrik 2026-10-17)
        if (guess.length) { notes.push(...guess, '# rätt kommando, men inget block bad om det. Läs blocken först.'); errs++; continue; }
        errs++; explain(u, bad, msgs); continue;
      }
      progressed = true; S.lastU = u;
      notes.push(...(said ?? (r || b.pack === 'fs' ? [QUIET] : sample(u, S.ps)))); // rätt svar ser ut som på riktigt
      typed += u.join(' ').length; // CPM räknar bara det som löste något
      if (++b.step === b.steps.length) hits.push(b);
      else { b.el.querySelector('.prog').textContent = `steg ${b.step + 1} av ${b.steps.length}`; if (b.landed) b.el.querySelector('.ans').textContent = sig() + show(b.steps[b.step][0].raw); }
    } finally { S.env['?'] = errs > e0 ? '1' : '0'; } }
    prevOk = errs === errsBefore;
  }
  echo(raw, bad, '', at);
  petWatch(raw);
  // Ett fritt kommando kan ställa sig i vägen (touch backup när blocket vill ha mappen backup). Spelet städar inte åt dig, Bit säger vad som hänt.
  if (mode === 'play') for (const b of S.blocks) {
    if (b.pack !== 'fs' || b.step || b.warned) continue;
    const w = blocker(b);
    if (!w || w === 'same') continue;
    b.warned = true;
    petSay(`"${b.text}" går inte att lösa just nu. Skalet skulle svara: ${w.split('\n')[0]} ${/exists/i.test(w) ? `Något med samma namn finns redan. Ta bort det först med ${S.ps ? 'Remove-Item' : 'rm'}, sen går det.` : 'Något blocket behöver saknas. Skapa det igen, eller klicka på blocket för hjälp.'}`, 'varning', 14000);
  }
  render();
  if (hint) msgs.push(hint);
  msgs.forEach(m => out(m, m.startsWith('#') ? 'cmt' : 'err'));
  notes.join('\n').split('\n').forEach(l => out(l, l.startsWith('#') ? 'cmt' : ''));
  S.typed += typed;

  const n = hits.length;
  for (const b of hits) {
    const p = points(b, n, S.level);
    S.score += p; S.cleared++;
    if (++S.streak % 10 === 0 && S.charges < 3) { S.charges++; out('# 10 rätt i rad: +1 clear. Skriv clear när brunnen börjar bli full.', 'hot'); petSay('Tio rätt i rad! Du fick en clear. Skriv clear när brunnen börjar bli full, så rensas allt.', 'nytt'); }
    out(`# +${fmt(p)}  ${b.why}`, 'cmt');
    remove(b);
  }
  if (n > 1) { out(`# kombo x${n}`, 'hot'); sfx('combo', n); if (n > 2) petSay(`Kombo x${n}! Flera block med samma Enter: ; kör kommandona efter varandra.`, 'nytt'); } else if (n || progressed) sfx('clear');
  if (progressed) S.stuck = 0;
  petFeed(hits.reduce((s, b) => s + (b.helped ? 0 : b.steps.length), 0), S.lastU);

  const lv = S.start + Math.floor(S.cleared / 10);
  if (lv > S.level) { S.level = lv; out(`# nivå ${lv}: tempot ökar`, 'hot'); petSay(`Nivå ${lv}! Blocken faller fortare nu, och svårare kommandon kan dyka upp.`, 'nytt'); sfx('levelUp'); music(); setTimeout(boss, 700); }
  if (errs) fail(errs); // varje fel räknas, så att ett makro med ; inte lönar sig
  if (errs && !progressed) {
    petFeel('sad', 1200);
    if (++S.stuck === 3 && !S.nudged) { S.nudged = true; petSay('Kört fast? Klicka på ett block, så visar hjälpkortet svaret. Blocket ger 0 poäng, men du lär dig kommandot.', 'tips', 10000); }
  }
  stats();
}

function fail(n = 1) {
  S.streak = 0; S.errors += n; S.env['?'] = '1';
  sfx('error');
}

function clearCmd() {
  if (mode === 'play' && S.charges > 0) {
    S.charges--;
    [...S.blocks].forEach(remove);
    sfx('bomb');
    setTimeout(() => out('# clear: brunnen tömd', 'hot'));
  } else setTimeout(() => log.replaceChildren()); // som riktig clear: töm skärmen
}

// ---------- statistik ----------
const cpm = () => (S && S.time > 5 ? Math.round(S.typed / (S.time / 60)) : 0);
const best = () => scoresLoad()[0]?.s ?? 0;
let lastStats = '';
const statRows = () => [['shell', (S?.ps ?? isPS()) ? 'PowerShell' : 'bash'], ['pack', PACKS[S?.pack ?? prefs.pack].name], ['score', S?.score ?? 0], ['level', S?.level ?? prefs.level],
  ['cpm', cpm()], ['streak', S?.streak ?? 0], ['clear', S?.charges ?? 0], ['best', best()]];
function stats() {
  const landed = S ? S.blocks.filter(b => b.landed).length : 0, rows = statRows();
  const key = rows.join() + landed + (S?.errors ?? 0);
  if (key === lastStats) return;
  lastStats = key;
  const lines = ['<span class="br">{</span>', ...rows.map(([k, v], i) =>
    `  <span class="k">"${k}"</span>: ${typeof v === 'string' ? `<span class="s">"${esc(v)}"</span>` : `<span class="n">${v}</span>`}${i < rows.length - 1 ? ',' : ''}`), '<span class="br">}</span>'];
  if (edTab === 'stats' && !editing) $('#code').innerHTML = codeLines(lines);
  $('#problems').textContent = $('#problems').dataset.n = landed;
  $('#st-err').innerHTML = `&#8855; ${S?.errors ?? 0} &#9888; ${landed}`;
  $('#st-level').textContent = `nivå ${S?.level ?? prefs.level}`;
  $('#st-score').textContent = `${fmt(S?.score ?? 0)} p`;
  $('#st-cpm').textContent = `${cpm()} CPM`;
  $('#st-clear').textContent = `clear ×${S?.charges ?? 0}`;
}

function changes(a, b, path = []) {
  return [...new Set([...Object.keys(a), ...Object.keys(b)])].filter(k => k !== '.git').flatMap(k => {
    const p = [...path, k];
    if (!Object.hasOwn(b, k)) return [[p, 'D']];

    if (typeof a[k] === 'object' && typeof b[k] === 'object') return changes(a[k], b[k], p);
    return a[k] === b[k] ? [] : [[p, 'M']];

function commit(u) {

  if (u.includes('--amend') && S.commits.length) S.commits[0].msg = msg;
  else S.commits.unshift({msg, id: Math.random().toString(16).slice(2, 9).padEnd(7, '0')});
  S.base = structuredClone(S.fs);
}
// git ändrar också världen: clone ger en mapp, init ett repo, commit en rad i källkontrollen
function gitWorld(u) {
  if (u[0] !== 'git') return;
  if (u[1] === '-C') u = ['git', ...u.slice(3)];
  const here = look(S.fs, S.cwd, S.ps).node, args = u.slice(2).filter(t => !t.startsWith('-')), br = S.branches;
  if (u[1] === 'commit') return commit(u);
  // grenar: skapa, byta, ta bort (aldrig den du står på)
  const creates = (u[1] === 'switch' && u.includes('-c')) || (u[1] === 'checkout' && u.includes('-b'));
  if (creates && args[0]) { br.add(args[0]); S.branch = args[0]; }
  else if ((u[1] === 'switch' || u[1] === 'checkout') && br.has(args[0])) S.branch = args[0];
  if (u[1] === 'branch' && u.some(t => /^-[dD]$|^--delete$/.test(t))) args.forEach(b => b !== S.branch && br.delete(b));
  else if (u[1] === 'branch' && args[0]) br.add(args[0]);
  if (typeof here !== 'object') return;
  // restore och checkout -- f: filen som den var vid senaste commit
  if (u[1] === 'restore' || (u[1] === 'checkout' && !creates && !br.has(args[0]))) for (const f of args) {
    const p = resolve(S.cwd, f), was = look(S.base ?? WORLD, p, S.ps).node, dir = look(S.fs, p.slice(0, -1), S.ps).node;
    if (typeof was === 'string' && typeof dir === 'object') own(dir, p.at(-1), was);
  }
  if (u[1] === 'clone' && args[0]) {
    const name = args[1] ?? args[0].split('/').at(-1).replace(/\.git$/, '');
    if (!Object.hasOwn(here, name)) own(here, name, {'.git': {}, 'README.md': `# ${name}\n`});

// vim: allt du skriver går till vim tills du skriver :q!. Blocken faller under tiden, det är fällan.
function egg([c0, ...rest], raw) {
  const arg = rest.join(' ');
  if (S.ps) {
    if (c0?.toLowerCase() !== 'sudo') return false;
    echo(raw, new Set());
    out('sudo.exe : Sudo is disabled on this machine. To enable it, go to the Developer Settings page in the Settings app', 'err');
    out('# Windows 11 har fått sudo, men den är avstängd från början. Brukar du behöva den: högerklicka på terminalen och välj Kör som administratör.', 'cmt');
    return true;
  }
  const reply = (text, cls, note) => { echo(raw, new Set()); out(text, cls); if (note) out(note, 'cmt'); return true; };
  if (c0 === 'vim' || c0 === 'vi') { echo(raw, new Set()); enterVim(rest[0]); return true; }
  if (c0 === 'sl') { echo(raw, new Set()); train(); return true; }
  if (c0 === 'sudo' && /^(su|-i|-s|bash)$/.test(arg)) return reply('du is not in the sudoers file.  This incident will be reported.', 'err', '# Bara administratörer får bli root. Rapporten går till root, som aldrig läser sin post.');
  if (c0 === 'sudo' && arg === 'make me a sandwich') return reply('Okay.', '', '# xkcd 149. Utan sudo vägrar make.');
  if (c0 === 'make' && arg === 'me a sandwich') return reply("make: *** No rule to make target 'me'.  Stop.", 'err', '# Prova med sudo framför.');

}
function enterVim(file) {

  S.vim = {tries: 0};
  applyShell();
  if (!file) out('~\n~                VIM - Vi IMproved\n~\n~   type  :q<Enter>               to exit\n~   type  :help<Enter>  or  <F1>  for on-line help\n~', 'dim');
  else if (typeof n === 'string') out(n.split('\n').map(l => '  ' + l).join('\n') + `\n~\n"${file}" ${n.split('\n').length}L, ${new TextEncoder().encode(n).length}B`, 'dim');
  else out(`~\n~\n"${file}" [New]`, 'dim');
}
function vimSay(raw) {
  echo(raw, new Set());
  const t = raw.trim(), V = S.vim;

// ---------- påskägg: formatera om datorn ----------
// rm -rf / med --no-preserve-root eller /*, dd, mkfs, format C:, Format-Volume, Clear-Disk, Remove-Item C:\ ... låtsas krascha datorn.
// Ingen fråga först, med flit (Patrik 2026-10-17): sådant ska aldrig köras på chans, i fel fönster eller med fel sak markerad.
// Kraschen sparas (term-crash) och sitter kvar efter vanlig F5. Ut kommer man genom att installera om exakt rätt,
// genom hård omladdning (Ctrl+F5, Ctrl+Shift+R) eller genom att rensa webbplatsdata.
const CRASH = 'term-crash';
const WIPE = /^(sudo\s+)?rm\s+(-\S+\s+)*(\/\*|--no-preserve-root\s+(-\S+\s+)*\/|\/\s+(-\S+\s+)*--no-preserve-root)(\s|$)|^(sudo\s+)?(dd\s+if=\/dev\/(zero|random|urandom)\s+of=\/dev\/sd|mkfs)|^format\s+c:|^(format-volume|clear-disk)\b|^(remove-item|rm|ri|del|erase|rd|rmdir)\s+c:\\\*?\s+.*-r|^del\s+\/s\s+\/q\s+c:\\/i;
const SETUP = ps => [
  ['boot usb', 'Ingen startbar enhet hittades. Sätt i installations-USB:n och skriv: boot usb'],
  ['select disk 0', 'Installationsprogrammet startat. Välj disken: select disk 0'],
  ['create partition primary', 'Disk 0 är tom. Skapa en partition: create partition primary'],
  [ps ? 'new-localuser du' : 'useradd du', `Partition skapad, systemet installerat. Skapa din användare: ${ps ? 'New-LocalUser du' : 'useradd du'}`],
];
let crashEl = null;
function crash() {
  const ps = S.ps;
  well.querySelectorAll('.blk').forEach(e => e.remove());
  S = null; mode = 'crash';
  try { snd()?.stop(); } catch {}
  save(CRASH, {ps, step: 0});
  crashEl?.remove();
  crashEl = document.createElement('div');
  crashEl.className = 'crash' + (ps ? ' bsod' : '');
  crashEl.setAttribute('role', 'alert');
  document.body.append(crashEl);
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (ps) {
    let pct = calm ? 100 : 0;
    const draw = () => { crashEl.innerHTML = `<big>:(</big>Datorn stötte på ett problem och måste startas om. Vi samlar in lite felinformation och startar sedan om åt dig.<br><br>${pct} % klart<br><br><small>Stoppkod: CRITICAL_PROCESS_DIED<br>Det som misslyckades: C:\\ (allt)</small>`; };
    draw();
    const t = setInterval(() => { pct = Math.min(100, pct + 7); draw(); if (pct === 100) { clearInterval(t); setTimeout(() => reboot({ps, step: 0}), 900); } }, 180);
  } else {
    crashEl.textContent = `[    4.204242] Kernel panic - not syncing: VFS: Unable to mount root fs on unknown-block(0,0)
[    4.204243] CPU: 0 PID: 1 Comm: swapper/0 Not tainted 6.8.0-buildapp #1
[    4.204244] Call Trace:
[    4.204245]  dump_stack+0x42/0x66
[    4.204246]  panic+0xdeadbeef
[    4.204247]  rm_rf_slash+0x2a/0x2a
[    4.204248] ---[ end Kernel panic - not syncing: allt är borta ]---`;
    setTimeout(() => reboot({ps, step: 0}), calm ? 600 : 2600);
  }
}
// Efter kraschen: en svart skärm som vill bli ominstallerad, ett kommando i taget
function reboot(st) {
  mode = 'crash';
  crashEl?.remove();
  crashEl = document.createElement('div');
  crashEl.className = 'crash';
  crashEl.innerHTML = `<div id="crashlog"></div><label>&gt; <input id="crashin" autocomplete="off" spellcheck="false" aria-label="Skriv kommando"></label>`;
  document.body.append(crashEl);
  const logEl = crashEl.querySelector('#crashlog'), inp = crashEl.querySelector('#crashin');
  const line = (t, c = '') => logEl.insertAdjacentHTML('beforeend', `<div class="${c}">${esc(t)}</div>`);
  const steps = SETUP(st.ps);
  line(steps[st.step][1]);
  inp.focus();
  crashEl.onclick = () => inp.focus();
  inp.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const v = inp.value.trim().replace(/\s+/g, ' ').toLowerCase();
    line('> ' + inp.value); inp.value = '';
    if (v !== steps[st.step][0]) {
      st.step = 0; save(CRASH, st);
      line(`${v ? `'${v}' gick inte.` : ''} Installationen avbröts. Börja om från början.`, 'err');
      return line(steps[0][1]);
    }
    if (++st.step < steps.length) { save(CRASH, st); return line(steps[st.step][1]); }
    try { localStorage.removeItem(CRASH); } catch {}
    line(st.ps ? 'Windows PowerShell\nCopyright (C) Microsoft Corporation. All rights reserved.' : 'Ubuntu 24.04 LTS buildapp tty1\n\nbuildapp login: du', 'dim');
    line('# Välkommen tillbaka. På en riktig dator hade allt varit borta: ingen papperskorg, ingen ångra. Det enda som räddar dig är en backup.', 'cmt');
    inp.disabled = true;
    setTimeout(() => { crashEl.remove(); crashEl = null; menu(); cmd.focus(); }, 2500);
  };
}

// ---------- bossfrågan mellan nivåerna ----------
// Kommandot visas, välj vad det gör: andra hållet mot spelet, där du får uppgiften och skriver kommandot.
// Frågorna kommer från quizet på buildapp.se/ai (/ai/quiz-data.js). Flerval tas som de är, para ihop blir
// "vilken beskrivning passar X" med två felsvar ur samma omgång. Saknas filen tas en vad-fråga ur rundans paket.
function bossQuestion() {
  if (typeof QUIZZES === 'undefined') {
    const items = quizItems(S.pack, S.ps), fresh = items.filter(x => !S.asked.has(x.text));
    return fresh.length ? {...quizQuestion(items, rnd(fresh), 'vad'), key: null} : null;
  }
  const steps = QUIZZES.flatMap(z => z.steps || []).filter(st => st.q || st.pairs);
  const all = steps.flatMap(st => st.q ? [{st}] : st.pairs.map((pr, i) => ({st, i})));
  const fresh = all.filter(x => !S.asked.has(x.st.q || x.st.pairs[x.i][0]));
  if (!fresh.length) return null;
  const {st, i} = rnd(fresh);
  if (st.q) return {kind: 'fri', key: st.q, ask: st.q, options: st.options, answer: st.answer, why: st.why};
  const [term, desc, name, more] = st.pairs[i];
  const options = shuffle([desc, ...shuffle(st.pairs.filter((_, j) => j !== i)).slice(0, 2).map(x => x[1])]);
  return {kind: 'fri', key: term, ask: `Vilken beskrivning passar ${term}?`, options, answer: options.indexOf(desc), why: [name && `${term} = ${name}.`, more].filter(Boolean).join(' ')};
}
function boss() {
  if (mode !== 'play' || S.agent?.busy) return;
  const x = S.boss = bossQuestion();
  if (!x) return;
  S.asked.add(x.key ?? x.it.text);
  mode = 'boss';
  try { snd()?.stop(); } catch {}
  screen.innerHTML = `<p class="hot"># bossfråga: rätt svar ger en clear-laddning</p>${askHTML(x)}`;
  screen.hidden = false;
}
function bossAnswer(i) {
  const x = S.boss;
  if (mode !== 'boss' || x.done || !x.options[i]) return;
  x.done = true;
  const right = i === x.answer;
  if (right && S.charges < 3) S.charges++;
  sfx(right ? 'combo' : 'error', 2);
  screen.insertAdjacentHTML('beforeend', answerHTML(x, i, right ? `Rätt! +1 clear${S.charges === 3 ? ' (max 3)' : ''}` : '') + '<div class="actions"><button data-act="bossEnd"><kbd>Enter</kbd> fortsätt</button></div>');
  stats();
}
function bossEnd() {
  if (mode !== 'boss') return;
  mode = 'pause';
  pause(false);
}

const AGENTS = {

};
function enterAgent(who) {

  out(`  cwd: ${where(S.cwd, S.ps)}`, 'dim');

}

}

}
// Det agenten svarar: aldrig hjälp, men alltid något att lära
function agentReply() {
  const b = S.blocks.filter(x => !x.landed).sort((x, y) => y.y - x.y)[0], A = S.agent;
  const ans = b && show(b.steps[b.step][0].raw), other = b?.other && show(b.other);
  const all = [
    'Du har helt rätt!',
    'Bra fråga. Låt mig först skriva en plan i PLAN.md. Och en plan för planen.',
    `Jag har läst hela kodbasen. Den är fin. Vad var frågan?`,
    `Jag ser ${S.blocks.length} block. Ska jag skriva ett test för dem först?`,
    ...(other ? [`Kommandot du letar efter är ${other}. (Fast det är för ${S.ps ? 'bash' : 'PowerShell'}, och du kör ${S.ps ? 'PowerShell' : 'bash'}. Läs alltid vad agenten föreslår.)`] : []),
    ...(ans ? [`Vill du att jag kör ${ans} åt dig? (y/n)`] : []),
    ...(A.who === 'codex' ? ['Jag körde det i en sandlåda. Sandlådan har inget nätverk, inga filer och ingen terminal. Klart!'] : []),
    ...(A.who === 'gemini' ? ['Jag hittade 1 240 000 resultat. Det första är en annons.'] : []),
  ];
  const r = all[Math.floor(Math.random() * all.length)];
  if (r.endsWith('(y/n)')) A.ask = b;

}
function agentSay(raw) {
  echo(raw, new Set());
  const t = raw.trim(), A = S.agent;
  if (/^\/?(exit|quit)$/i.test(t)) return leaveAgent();
  if (A.busy) return out('# agenten tänker fortfarande. Esc avbryter.', 'dim');
  if (A.ask) {
    const b = A.ask;
    A.ask = null;
    if (!/^(y|yes|j|ja)$/i.test(t)) return out('⏺ Okej, jag gör ingenting. Det kan jag.', 'agent');
    if (S.blocks.includes(b) && !b.landed) { remove(b); S.cleared++; sfx('clear'); }
    out('⏺ Klart, ett block borta.', 'agent');
    out(`Du har nått din användningsgräns. Den återställs kl 03.00.`, 'err');
    out('# Agenter kostar. Resten får du skriva själv.', 'cmt');
    return leaveAgent();
  }
  const line = document.createElement('div');
  line.className = 'line dim';
  log.append(line);
  const t0 = performance.now(), word = A.spin[Math.floor(Math.random() * A.spin.length)];
  const tick = () => { line.textContent = `✻ ${word}… (${Math.floor((performance.now() - t0) / 1000)} s · esc för att avbryta)`; };
  tick();
  Object.assign(A, {busy: true, line, timer: setInterval(tick, 250), done: setTimeout(() => {
    if (S?.agent !== A) return;
    clearInterval(A.timer); A.busy = false;
    line.className = 'line agent';
    line.textContent = '⏺ ' + agentReply();
  }, 2000 + Math.random() * 3000)});
}

function lit(name) {
  for (const b of document.querySelectorAll(`[data-do="${name}"]`)) {

    b.parentElement.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
    b.classList.add('on');

}

// Vardagsord och engelska till orden uppgifterna använder, så att "radera mapp" hittar "Ta bort mappen"
const SYN = {radera: 'bort', delete: 'bort', remove: 'bort', ta: '', ny: 'skapa', nytt: 'skapa', create: 'skapa', new: 'skapa', folder: 'mapp', directory: 'mapp', file: 'fil', byt: 'namn', rename: 'namn'};
function palette() {
  DO.search();
  const q = $('#q');
  if (!q) return;
  q.value = '>';
  hits('>');
}
function hits(q) {
  const k = q.trim().toLowerCase(), box = $('#hits');
  if (Object.hasOwn(EGGS, k)) return void (box.innerHTML = pre(EGGS[k]));
  if (k.startsWith('>')) { // kommandopaletten: menyernas kommandon, som i VS Code
    const f = k.slice(1).trim(), all = Object.entries(MENUS).flatMap(([m, list]) => list.filter(Boolean).map(([n, kb, a]) => [`${m}: ${n}`, kb, a]));
    const found = all.filter(([n]) => n.toLowerCase().includes(f));
    return void (box.innerHTML = found.length ? found.map(([n, kb, a]) => `<button type="button" class="hit" data-item="${esc(a)}">${esc(n)}<small>${esc(kb)}</small></button>`).join('') : '<p class="note">Inga kommandon matchar.</p>');
  }
  if (!k) return void (box.innerHTML = '');
  const ps = S?.ps ?? isPS(), words = k.split(/\s+/).map(w => (Object.hasOwn(SYN, w) ? SYN[w] : w)).filter(Boolean);
  const found = TASKS.filter(t => !ps || t[5]).map(t => fill(t, a => a[0], ps))
    .filter(b => words.every(w => `${b.text} ${b.steps.map(x => x[0].raw).join(' ')} ${b.why}`.toLowerCase().includes(w)));
  const seen = new Set(), uniq = found.filter(b => !seen.has(b.text) && seen.add(b.text)).slice(0, 8);
  box.innerHTML = uniq.length ? uniq.map(b => `<p class="cmt"># ${esc(b.text)}</p><p>${sig()}${esc(b.steps.map(x => show(x[0].raw)).join(ps ? '; ' : ' && '))}</p><p class="dim">${esc(b.why)}</p>`).join('')
    : `<p class="dim">Inga träffar för "${esc(q)}". Prova ett vanligt ord: mapp, fil, radera, commit, gren.</p>`;
}

let README = `## ./terminal
Uppgifter faller som block. Skriv kommandot som blocket ber om och tryck Enter innan det landar.

## så spelar du

- klicka på ett block, eller skriv man (Get-Help i PowerShell), för hjälpkortet (blocket ger då 0 poäng)

## skal
bash finns på Linux och Mac, och i Git Bash på Windows. PowerShell är Windows. Byt under kugghjulet.

    sheet('problems', landed.length ? `<p class="cmt"># problem: block som landade, och svaren</p>${landed.map(b => `<p><span class="err">&#8855;</span> ${esc(b.text)}</p><p class="dim">  ${sig()}${esc(show(b.steps[b.step][0].raw))}</p>`).join('')}` : pre('Inga problem har upptäckts i arbetsytan. Än.'));
  },

  debug: () => {

      else if (get && get[1] in vals()) say(JSON.stringify(vals()[get[1]]));

  terminal: () => mode === 'sheet' && closeSettings(),

// [text, kortkommando, data-do eller en kommentar som skrivs i terminalen]
const MENUS = {
  File: [['Ny runda', 'Enter', 'start'], ['Spara', 'Ctrl+S', 'save'], ['Öppna mapp…', '', 'explorer'], 0, ['Avsluta', 'exit', 'quit']],
  Edit: [['Ångra', 'Ctrl+Z', '# Ctrl+Z ångrar inte i terminalen. rm har ingen papperskorg.'], ['Kopiera', 'Ctrl+C', '# Markera text och tryck Ctrl+C. Utan markering betyder Ctrl+C avbryt, som i en riktig terminal.'], 0, ['Sök', 'Ctrl+F', 'search']],
  Selection: [['Markera allt', 'Ctrl+A', '# I bash hoppar Ctrl+A till början av raden och Ctrl+E till slutet. I rutan här markerar den allt.'], ['Lägg till markör', 'Alt+klick', '# Flera markörer finns i redigeraren, inte i terminalen. Flera terminaler i samma fönster heter tmux. Det är en annan dag.']],
  View: [['Utforskaren', 'Ctrl+Shift+E', 'explorer'], ['Sök', 'Ctrl+Shift+F', 'search'], ['Källkontroll', '', 'scm'], 0, ['Helskärm', 'F11', 'fullscreen'], ['Zen-läge', '', 'zen']],
  Go: [['Gå till fil…', 'Ctrl+P', 'search'], ['Gå till rad…', 'Ctrl+G', '# Rad 42. Det är alltid rad 42.'], ['Tillbaka', 'Alt+←', '# cd - tar dig tillbaka till förra mappen i bash. cd .. går upp en nivå.']],
  Run: [['Starta felsökning', 'F5', 'run'], ['Kör utan felsökning', 'Enter', 'start']],
  Terminal: [['Ny terminal', '', 'start'], ['Dela terminal', '', '# Två terminaler, dubbelt så många block. Nej.'], ['Döda terminal', 'exit', 'quit']],
  Help: [['README', '', 'readme'], ['Kortkommandon', '', 'keys'], ['Svåra tecken', '~ | $', 'chars'], 0, ['Rapportera problem', '', 'issue'], ['Om', '', 'about']],

const pop = $('#pop');
function openMenu(btn) {
  closeMenu();
  btn.setAttribute('aria-expanded', 'true');
  pop.innerHTML = MENUS[btn.dataset.menu].map(it => it ? `<button type="button" role="menuitem" data-item="${esc(it[2])}">${esc(it[0])}<kbd>${esc(it[1])}</kbd></button>` : '<hr>').join('');
  const r = btn.getBoundingClientRect();
  pop.style.left = r.left + 'px'; pop.style.top = r.bottom + 2 + 'px';
  pop.hidden = false;
}
function closeMenu() {
  pop.hidden = true;
  document.querySelectorAll('[data-menu][aria-expanded=true]').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
document.addEventListener('click', e => {
  const m = e.target.closest('[data-menu]'), it = e.target.closest('[data-item]'), d = e.target.closest('[data-do]');
  if (m) return m.getAttribute('aria-expanded') === 'true' ? closeMenu() : openMenu(m);
  closeMenu();
  const act = it?.dataset.item ?? d?.dataset.do;
  if (!act) return;
  act.startsWith('#') ? say(act) : DO[act](!!d?.closest('.activity'));
  if (!$('#q') || !e.target.closest('#side')) cmd.focus();
});
document.addEventListener('keydown', e => {
  const hard = (e.key === 'F5' && (e.ctrlKey || e.shiftKey)) || (e.key.toLowerCase() === 'r' && e.ctrlKey && e.shiftKey);
  if (hard) try { localStorage.removeItem(CRASH); } catch {}
}, true);
document.addEventListener('mouseover', e => { const m = e.target.closest('[data-menu]'); if (m && !pop.hidden && m.getAttribute('aria-expanded') !== 'true') openMenu(m); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!pop.hidden) { closeMenu(); cmd.focus(); }
  document.documentElement.classList.remove('zen');
});

const typing = e => !e.ctrlKey && !e.metaKey && !e.altKey && (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Delete');
cmd.addEventListener('keydown', e => {
  try { snd()?.init?.(); } catch {} // ljud som inte kan starta får aldrig stoppa tangenterna
  const k = e.key;
  if (e.ctrlKey && k === ',' && mode !== 'shell' && mode !== 'over') { e.preventDefault(); return settings(); }
  if (mode === 'shell') {
    if (k === 'Enter') { setShell(prefs.shell); menu(); }
    else if (['ArrowUp', 'ArrowDown', '1', '2'].includes(k)) setShell(k === '1' ? 'ps' : k === '2' ? 'bash' : otherShell());
    else if (!typing(e)) return;
    return e.preventDefault();
  }
  if (k === 'P' && e.ctrlKey && e.shiftKey && mode !== 'shell') { e.preventDefault(); return palette(); }
  if (/^[pf]$/i.test(k) && e.ctrlKey && mode !== 'shell') { e.preventDefault(); return DO.search(); } // Ctrl+P, Ctrl+F, Ctrl+Shift+P/F
  if (k.toLowerCase() === 'e' && e.ctrlKey && e.shiftKey && mode !== 'shell') { e.preventDefault(); return DO.explorer(); }
  if (k === 's' && e.ctrlKey) { e.preventDefault(); return DO.save(); }
  if (mode === 'settings' || mode === 'sheet') {
    if (k === 'Escape') closeSettings();
    else if (k === 's' && mode === 'settings' && backTo === 'menu') setShell(otherShell());
    else if (!typing(e)) return;
    return e.preventDefault();
  }
  if (mode === 'menu') {
    if (k === 'Enter') go();
    else if ((k === 's' || k === 'm') && performance.now() - menuTyped < 1500) menuTyped = performance.now(); // ls eller mkdir skrivet i menyn ska inte byta skal eller läge
    else if (k === 's') setShell(otherShell());
    else if (k === 'm') setKind(prefs.kind === 'quiz' ? 'game' : 'quiz');
    else if (k >= '1' && k <= String(Object.keys(PACKS).length)) setPack(Object.keys(PACKS)[k - 1]);
    else if (k === 'ArrowUp' || k === 'ArrowDown') {
      const keys = Object.keys(PACKS), i = keys.indexOf(prefs.pack) + (k === 'ArrowUp' ? -1 : 1);
      setPack(keys[(i + keys.length) % keys.length]);
    }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') setLevel(k === 'ArrowLeft' ? -1 : 1);
    else if (typing(e)) { menuTyped = performance.now(); return e.preventDefault(); }
    else return;
    e.preventDefault();
    return music();
  }
  if (mode === 'quiz' || mode === 'quizover') {
    if (k === 'Escape') { e.preventDefault(); return menu(); }
    if (k !== 'Enter') return; // skriv som vanligt
    e.preventDefault();
    const v = cmd.value.trim(), c = v.toLowerCase(), q = Q.qs[Q.i];
    cmd.value = ''; sync();
    if (!v) return mode === 'quizover' ? quiz() : quizNext();
    if (mode === 'quiz' && !q.done) {
      if (/^[a-d]$/.test(c)) return q.pairs ? quizMatch('abcd'.indexOf(c)) : quizAnswer('abcd'.indexOf(c));
      if (q.pairs && /^[1-4]$/.test(c)) return quizPick(+c - 1);
      if (q.pairs && /^[1-4] ?[a-d]$/.test(c)) { quizPick(+c[0] - 1); return quizMatch('abcd'.indexOf(c.at(-1))); }
    }
    return run(v);
  }
  if (mode === 'boss') {
    const i = 'abcd'.indexOf(k.toLowerCase());
    if (i >= 0 && !e.ctrlKey && !S.boss.done) bossAnswer(i);
    else if ((k === 'Enter' || k === 'Escape') && S.boss.done) bossEnd();
    if (typing(e) || k === 'Enter') e.preventDefault();
    return;
  }
  if (mode === 'over') {
    if (k === 'Enter') start(); else if (k === 'd') share(); else if (k === 'Escape') menu(); else if (!typing(e)) return;
    return e.preventDefault();
  }
  if (mode === 'pause') { if (k === 'Escape' || k === 'Enter') { e.preventDefault(); pause(false); } else if (e.ctrlKey && k.toLowerCase() === 'c') { e.preventDefault(); gameOver(); } else if (typing(e)) e.preventDefault(); return; } // inget förskrivet svar under paus
  if (k === 'Enter') { e.preventDefault(); const v = cmd.value; cmd.value = ''; run(v); }
  else if (k === 'Escape') S?.agent?.busy ? agentStop() : pause(true);
  else if (k === 'ArrowUp' || k === 'ArrowDown') {
    e.preventDefault();
    if (hpos === hist.length) draft = cmd.value; // den halvskrivna raden kommer tillbaka med pil ner, som i bash
    hpos = Math.max(0, Math.min(hist.length, hpos + (k === 'ArrowUp' ? -1 : 1)));
    cmd.value = hpos === hist.length ? draft : hist[hpos];
    cmd.setSelectionRange(cmd.value.length, cmd.value.length);
  } else if (e.ctrlKey && k === 'c' && !cmd.value.slice(cmd.selectionStart, cmd.selectionEnd) && S?.vim) {
    e.preventDefault(); out('Type  :qa!  and press <Enter> to abandon all changes and exit Vim', 'dim');
  } else if (e.ctrlKey && k === 'c' && !cmd.value.slice(cmd.selectionStart, cmd.selectionEnd) && S?.agent && !cmd.value) {
    e.preventDefault();
    if (performance.now() - (S.agent.cc || 0) < 2000) leaveAgent(); else { S.agent.cc = performance.now(); out('Tryck Ctrl+C igen för att avsluta.', 'dim'); }
  } else if (e.ctrlKey && k === 'c' && !cmd.value.slice(cmd.selectionStart, cmd.selectionEnd)) {
    e.preventDefault(); echo(cmd.value, new Set(), '^C'); cmd.value = '';
  } else if (e.ctrlKey && k === 'l') { e.preventDefault(); log.replaceChildren(); }
  else if (k === 'Tab') { e.preventDefault(); tab(); }
  else return;
  sync();
});
